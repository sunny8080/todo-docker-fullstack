# This compose dockerfile will be used for production build purpose
services:
  frontend:
    build:
      context: ./frontend
      args:
        # Vite embeds this URL in the browser bundle at build time.
        VITE_BED_URL: ${VITE_BED_URL:-http://localhost:3000}
    container_name: todo-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: todo-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.prod
    environment:
      PORT: "3000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    restart: unless-stopped
