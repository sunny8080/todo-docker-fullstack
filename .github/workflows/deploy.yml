name: Dummy Deploy

on:
  push:
    branches:
      - main
      - release-*
    paths-ignore:
      - 'README.md'
      - '**/README.md'
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Setup node version
      # - name: Setup Node
      #   uses: actions/setup-node@v7
      #   with:
      #     node-version: 22

      # Caches actual node_modules directory
      # - name: Cache frontend node_modules
      #   id: fronted-cache
      #   uses: actions/cache@v6
      #   with:
      #     path: frontend/node_modules
      #     key: frontend-${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}

      # install frontend node_modules and skip this step if node_modules is cached
      # - name: Install frontend Dependencies
      #   if: steps.fronted-cache.outputs.cache-hit != 'true'
      #   run: npm ci
      #   working-directory: frontend

      - name: Setup Frontend Node and caches
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint Code
        run: npm run lint
        working-directory: frontend

  frontend-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Frontend Node and caches
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Unit test Code
        id: run-tests
        run: npm run test
        working-directory: frontend

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-test-report
          path: frontend/frontend-unit-test-report.json
          if-no-files-found: warn

  # build:
  # deploy:
