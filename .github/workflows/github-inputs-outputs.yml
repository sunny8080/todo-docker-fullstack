name: GitHub Input Outputs
on:
  workflow_dispatch:
    # define inputs, which need to take while triggering manually
    inputs:
      artifact_id:
        description: Enter artifact ID
        required: true
        type: string

      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - production

      version:
        description: Build version
        required: false
        type: string

# share variable across the workflow, using env workflow-level
env:
  workflow_level_var: github-inputs-outputs.yml

jobs:
  # share variable between steps in the same job # use $GITHUB_ENV
  step-level-var:
    runs-on: ubuntu-latest
    steps:
      - name: Define Step level variable
        run: |
          echo "step_level_var=define-step-var" >> $GITHUB_ENV
      - name: Use variable
        run: |
          echo "Step Level Var : $step_level_var"
      - name: Use workflow level variable
        run: |
          echo "Workflow level var: $workflow_level_var"

  # share variable between different jobs, using GITHUB_OUTPUT
  job-level-var:
    runs-on: ubuntu-latest
    outputs:
      script_name: ${{ steps.set-vars.outputs.script_name }}
      current_time: ${{ steps.set-vars.outputs.current_time }}
      current_date: ${{ steps.set-vars.outputs.current_date }}
    steps:
      - name: Define job level variable
        id: set-vars
        run: |
          echo "script_name=deploy.sh" >> $GITHUB_OUTPUT
          echo "current_time=$(date '+%H:%M:%S')" >> $GITHUB_OUTPUT
          echo "current_date=$(date '+%d-%m-%Y')" >> $GITHUB_OUTPUT
      - name: Print script name
        run: |
          echo "script name=${{ steps.set-vars.outputs.script_name}}"
          echo "current time=${{ steps.set-vars.outputs.current_time }}"
          echo "current date=${{ steps.set-vars.outputs.current_date }}"
          echo "Timestamp: $(date -u +%s%3N)"

  # use job level variable using needs
  use-job-level-var:
    runs-on: ubuntu-latest
    needs: job-level-var
    steps:
      - name: Use job level variable
        run: |
          echo "script name : ${{needs.job-level-var.outputs.script_name}}"
          echo "current time : ${{needs.job-level-var.outputs.current_time}}"
          echo "current date : ${{needs.job-level-var.outputs.current_date}}"

  # use input variable
  use-input-var:
    runs-on: ubuntu-latest
    steps:
      - name: Print input artifact id
        run: |
          echo "Artifact ID: ${{ inputs.artifact_id }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
