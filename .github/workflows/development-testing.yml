name: Development Testing

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  frontend-testing:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'feature/') ||
      startsWith(github.head_ref, 'issue/') ||
      startsWith(github.head_ref, 'dev-')
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "Source Branch: ${{ github.head_ref || github.ref_name }}"
          echo "Target Branch: ${{ github.base_ref }}"
          echo "Commit ID: ${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event name: ${{ github.event_name }}"

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Frontend Node and caches
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint Code
        run: npm run lint
        working-directory: frontend

      - name: Unit Test Code
        id: run-tests
        run: npm run test
        working-directory: frontend

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-test-report
          path: frontend/frontend-unit-test-report.json
          if-no-files-found: warn
